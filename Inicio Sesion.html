<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<style>
body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #000000 0%, #000000 50%, #460202 100%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}

.login-card {
    max-width: 420px;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
}
.color-texto {
    color: #c1bebe;
    
}
.login-card .card-title { color: #ffffff; font-weight:600; }
.login-card .form-control { background: rgba(255,255,255,0.02); color: #fff; border: 1px solid rgba(255,255,255,0.06); }
.login-card .form-control::placeholder { color: rgba(255,255,255,0.6); }
.login-card .form-control:focus { box-shadow: none; border-color: rgba(255,255,255,0.18); }
.login-card .form-text, .login-card .text-muted { color: rgba(255,255,255,0.6); }
.login-card a { color: #ffd1d1; }
.login-card .btn-primary { background: #d6333f; border-color: #c12a36; }
</style>

<div class="container d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 20px);">
  <div class="card login-card p-4 shadow">
    <h3 class="card-title text-center mb-1">Iniciar sesión</h3>
    <p class="text-center text-muted mb-3"><div style="color: #c1bebe;">Ingresa tu correo y contraseña para acceder</div></p>
    <form id="loginForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="emailLogin" class="form-label color-texto">Correo electrónico</label>
        <input type="email" class="form-control" id="emailLogin" name="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label for="passwordLogin" class="form-label color-texto">Contraseña</label>
        <input type="password" class="form-control" id="passwordLogin" name="password" placeholder="Contraseña" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label" for="remember"><div class="color-texto">Acepto los términos y condiciones</div></label>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </div>
      <div class="mt-3 text-center">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="mt-2 text-center text-muted small">
        ¿No tienes cuenta? <a href="Registro_SG.html">Regístrate</a>
      </div>
    </form>
  </div>
</div>

<center>
<footer>
        <p>&copy; 2024 Softgym. Todos los derechos reservados.</p>
    </footer>
    </center>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>      
</body>
</html>
