<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<style>
</style>
<br>

<div class="container d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 20px);">
    <div class="card p-4 shadow" style="max-width:600px; width:100%; background: rgba(255, 255, 255, 0.03); border:1px solid rgba(255,255,255,0.08);">
        <h3 class="card-title text-center mb-3" >Registro de usuario</h3>
        <form id="registerForm" class="needs-validation" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label"><div class="color-texto">Nombre</div></label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Juan" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="apellidos" class="form-label"><div class="color-texto">Apellidos</div></label>
                    <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Pérez" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="edad" class="form-label"><div class="color-texto">Edad</div></label>
                    <input type="number" class="form-control" id="edad" name="edad" min="0" max="120" placeholder="30" required>
                </div>
                <div class="col-md-8 mb-3">
                    <label for="tipoDoc" class="form-label"><div class="color-texto">Tipo de documento</div></label>
                    <select class="form-select" id="tipoDoc" name="tipoDoc" required>
                        <option value="0" disabled selected>Selecciona...</option>
                        <option>CC - Cédula de ciudadanía</option>
                        <option>TI - Tarjeta de identidad</option>
                        <option>CE - Cédula de extranjería</option>
                        <option>PPE - Pasaporte</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="numDoc" class="form-label"><div class="color-texto">Número de documento</div></label>
                <input type="text" class="form-control" id="numDoc" name="numDoc" placeholder="123456789" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label"><div class="color-texto">Teléfono móvil</div></label>
                <input type="tel" class="form-control" id="telefono" name="telefono" pattern="[0-9]{7,15}" placeholder="3001234567" required>
                <div class="form-text">Solo números, entre 7 y 15 dígitos.</div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label"><div class="color-texto">Correo electrónico</div></label>
                <input type="email" class="form-control" id="email" name="email" placeholder="tu@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label"><div class="color-texto">Contraseña</div></label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-danger">Registrar</button>
            </div>
        </form>
    </div>
</div>
<br>
<center>
<footer>
        <p>&copy; 2024 Softgym. Todos los derechos reservados.</p>
    </footer>
    </center>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>      
</body>
</html>
